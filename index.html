<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本音の相談室 | 鑑定依頼フォーム</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Serif+JP:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-overlay"></div>

    <div class="container">
        <!-- ヘッダーセクション -->
        <header class="main-header">
            <div class="header-visual">
                <span class="moon">☽</span>
                <span class="star">★</span>
            </div>
            <h1 class="main-title" id="form-title">本音の相談室</h1>
            <p class="sub-title" id="form-subtitle">鑑定依頼フォーム</p>
            <div class="divider">
                <span class="line"></span>
                <span class="ornament">❀</span>
                <span class="line"></span>
            </div>
        </header>

        <!-- フォームセクション -->
        <main class="form-container">
            <form id="fortune-form">
                <input type="hidden" id="plan" name="plan" value="trial">
                


                <!-- ThreadsID（中央配置） -->
                <div class="input-row">
                    <div class="input-group center-group">
                        <label for="name" id="label-name">ThreadsID(必須)</label>
                        <input type="text" id="name" name="name" placeholder="例：@username" required>
                    </div>
                </div>

                <!-- 生年月日とジャンル（左右端に配置） -->
                <div class="input-row">
                    <div class="input-group birthday-group">
                        <label>生年月日</label>
                        <div class="birthday-inputs">
                            <input type="number" id="year" name="year" placeholder="1990" min="1900" max="2026" required>
                            <span>/</span>
                            <input type="number" id="month" name="month" placeholder="1" min="1" max="12" required>
                            <span>/</span>
                            <input type="number" id="day" name="day" placeholder="1" min="1" max="31" required>
                        </div>
                    </div>

                    <div class="input-group genre-group">
                        <label for="genre">相談ジャンル</label>
                        <select id="genre" name="genre" required>
                            <option value="" disabled selected>選択</option>
                            <option value="恋愛">恋愛</option>
                            <option value="結婚">結婚</option>
                            <option value="仕事">仕事</option>
                            <option value="転職">転職</option>
                            <option value="お金">お金</option>
                            <option value="人間関係">人間関係</option>
                            <option value="家族">家族</option>
                            <option value="健康">健康</option>
                            <option value="総合">総合</option>
                        </select>
                    </div>
                </div>

                <!-- 相談内容（フル幅） -->
                <div class="input-group consultation-group">
                    <label for="consultation">相談内容・占いたいこと</label>
                    <textarea id="consultation" name="consultation" rows="6" placeholder="あなたの本音をお書きください" required></textarea>
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">鑑定を依頼する</button>
            </form>
        </main>

        <!-- 送信完了画面 -->
        <section id="success-screen" class="success-screen hidden">
            <div class="success-content">
                <div class="success-visual">
                    <img src="images/icon.png" alt="鑑定依頼完了" class="success-img">
                </div>
                <h2 class="success-title">鑑定依頼を承りました</h2>
                <p class="success-text" id="success-message">結果をお届けするまで、今しばらくお待ちください。</p>
                <div class="divider">
                    <span class="line"></span>
                    <span class="ornament">❀</span>
                    <span class="line"></span>
                </div>
                <button onclick="location.reload()" class="back-btn">戻る</button>
            </div>
        </section>

        <footer class="main-footer">
            <p>&copy; 本音の相談室</p>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
</body>

</html>
